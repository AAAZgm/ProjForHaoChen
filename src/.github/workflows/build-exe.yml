# ============================================================
# GitHub Actions 工作流：自动构建 Windows 可执行文件 (.exe)
# ============================================================
# 使用方法：
#   1. 把项目推送到 GitHub 仓库
#   2. 在仓库页面 Actions 选项卡手动运行此工作流，
#      或打 tag（如 v1.0）自动触发
#   3. 构建完成后在 Actions 运行记录里下载 .exe 产物
#      （绿色对勾 -> Artifacts -> 下载）
# ============================================================
name: 构建 Windows exe

on:
  workflow_dispatch:        # 手动触发
  push:
    tags: ["v*"]            # 推送 v1.0 等标签时自动触发

jobs:
  build-windows:
    name: 打包 Windows exe
    runs-on: windows-latest
    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Python 3.12
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 安装项目依赖 + 打包工具
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. 执行打包（使用仓库内的 spec 配置）
      - name: 打包
        run: |
          python -m PyInstaller --noconfirm bili_video_tool.spec

      # 5. 上传构建产物
      - name: 上传 .exe
        uses: actions/upload-artifact@v4
        with:
          name: B站视频处理工具-exe
          path: dist/*.exe
