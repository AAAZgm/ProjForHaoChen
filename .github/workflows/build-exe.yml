name: Test and build Windows portable app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements-build.txt
      - name: Install locked build environment
        run: python -m pip install -r src/requirements-build.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test, build, smoke-check and zip
        run: python scripts/build_portable.py
      - name: Upload portable zip and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: bili-video-tool-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-verification.json
          if-no-files-found: error
