name: Build and verify macOS and Linux packages

on:
  workflow_dispatch:
  push:
    branches: ["stage-e/platform-packages"]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements-build.txt
      - name: Install locked build environment
        run: python -m pip install -r src/requirements-build.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Prepare verified native ffprobe
        run: python scripts/prepare_ffprobe.py
      - name: Test, freeze, audit and verify extracted package
        run: python scripts/build_portable.py
      - name: Upload verified package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: bili-video-tool-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*-verification.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .cache/ffprobe/build-*.log
            build/pyinstaller.log
            build/portable-*/verification/**/*.log
            build/portable-*/verification/**/report.json
          if-no-files-found: ignore
